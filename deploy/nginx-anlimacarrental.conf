# /etc/nginx/sites-available/anlimacarrental
# The app accepts form posts only from BETTER_AUTH_URL, so www redirects to the
# bare domain. Certbot adds the HTTPS (443) settings to both blocks.
server {
    listen 80;
    listen [::]:80;
    server_name www.anlimacarrental.com;
    return 301 https://anlimacarrental.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name anlimacarrental.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # The chat assistant streams its reply; pass it through unbuffered.
    location /api/assistant {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
